services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: halohola
      POSTGRES_USER: halohola
      POSTGRES_PASSWORD: halohola_change_me
    volumes:
      - halo_hola_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halohola -d halohola"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:4000
      DATABASE_URL: postgresql://halohola:halohola_change_me@db:5432/halohola?schema=public
      ADMIN_API_KEY: change-me-before-production
      VITE_API_URL: /api
    ports:
      - "4000:4000"
    volumes:
      - halo_hola_uploads:/app/uploads

volumes:
  halo_hola_db:
  halo_hola_uploads:
