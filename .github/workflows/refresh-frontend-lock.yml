name: refresh frontend lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --prefix frontend
      - name: Commit frontend lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Frontend lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: refresh frontend dependency lock [skip ci]"
          git push origin main
