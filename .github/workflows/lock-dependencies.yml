name: lock dependencies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfiles
        run: |
          npm install --package-lock-only
          npm install --package-lock-only --prefix backend
          npm install --package-lock-only --prefix frontend
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
            exit 0
          fi
          git commit -m "chore: lock npm dependencies [skip ci]"
          git push origin main
