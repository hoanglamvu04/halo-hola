name: Refresh backend audited lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Apply npm security fixes to manifest and lockfile
        run: npm audit fix --prefix backend --force
      - name: Verify patched backend
        run: |
          npm test --prefix backend
          npm audit --prefix backend --omit=dev --audit-level=high
      - name: Commit audited dependency lockfile
        run: |
          if git diff --quiet -- backend/package.json backend/package-lock.json; then
            echo "No dependency lockfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          git commit -m "chore(deps): refresh backend audited lockfile"
          git push origin HEAD:main
