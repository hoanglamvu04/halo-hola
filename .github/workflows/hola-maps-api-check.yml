name: Hola Maps API check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hola-maps-api-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://maps.dothihoalac.vn/api/public/v1'
          ORIGIN='https://halohola.xspace.vn'

          check_json() {
            local path="$1"
            local filter="$2"
            echo "===== ${path} ====="
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              -D /tmp/hola-headers.txt \
              -H 'Accept: application/json' \
              "${BASE}${path}" \
              -o /tmp/hola-body.json
            grep -Ei '^(HTTP/|content-type:|x-ratelimit|retry-after:)' /tmp/hola-headers.txt || true
            jq -c "${filter}" /tmp/hola-body.json || cat /tmp/hola-body.json
            echo
          }

          check_json '/meta' '.data'
          check_json '/categories' '{meta:.meta,items:.data.items[0:3]}'
          check_json '/places?limit=2' '{meta:.meta,items:.data.items}'
          check_json '/places/bounds?north=21.145&south=20.885&east=105.665&west=105.325&limit=2' '{meta:.meta,items:(.data.items // .data)[0:2]}'
          check_json '/places/nearby?lat=21.0183736&lng=105.5476382&radius=5000&limit=2' '{meta:.meta,items:(.data.items // .data)[0:2]}'
          check_json '/places/645' '.data'
          check_json '/places/slug/lach-tach-cafe-photobooth' '.data'

          echo '===== /places/geojson ====='
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -D /tmp/hola-headers.txt \
            -H 'Accept: application/geo+json, application/json' \
            "${BASE}/places/geojson?north=21.145&south=20.885&east=105.665&west=105.325" \
            -o /tmp/hola-geo.json
          grep -Ei '^(HTTP/|content-type:|x-ratelimit|retry-after:)' /tmp/hola-headers.txt || true
          jq -c '{type,featureCount:(.features|length),firstFeature:.features[0]}' /tmp/hola-geo.json

          echo '===== CORS GET /meta from production origin ====='
          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -D /tmp/hola-cors-headers.txt \
            -H 'Accept: application/json' \
            -H "Origin: ${ORIGIN}" \
            -o /tmp/hola-cors-body.txt \
            -w '%{http_code}' \
            "${BASE}/meta")
          echo "status=${STATUS}"
          grep -Ei '^(HTTP/|content-type:|access-control-allow-origin:|access-control-allow-credentials:|vary:|x-ratelimit|retry-after:)' /tmp/hola-cors-headers.txt || true
          cat /tmp/hola-cors-body.txt
          echo
