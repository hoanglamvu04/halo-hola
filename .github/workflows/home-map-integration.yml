name: Integrate homepage Hola Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-map-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace fake homepage map with official Hola Maps embed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('frontend/src/pages/HomePage.jsx')
          text = home.read_text()

          replacements = [
            (
              "import { getCampaignStats, getHomepageContent, getThemes, getColors, getTours, getPlaces, getPublicArtworks } from '../services/api.js'\n",
              "import { getCampaignStats, getHomepageContent, getThemes, getColors, getTours, getPublicArtworks } from '../services/api.js'\nimport { getHolaMapConfig } from '../services/holaMapsApi.js'\n"
            ),
            (
              "  const [places,setPlaces]=useState([])\n",
              "  const [holaMapEmbedUrl,setHolaMapEmbedUrl]=useState('')\n"
            ),
            (
              "    getPlaces().then(data=>setPlaces(Array.isArray(data)?data:[])).catch(()=>{})\n",
              "    getHolaMapConfig().then(config=>setHolaMapEmbedUrl(config?.embedUrl||'https://maps.dothihoalac.vn/embed')).catch(()=>setHolaMapEmbedUrl('https://maps.dothihoalac.vn/embed'))\n"
            ),
            (
              "  const mapPreview=places[0]||null\n",
              ""
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected HomePage snippet not found: {old!r}')
            text = text.replace(old, new, 1)

          old_map = '''    {sectionOn('map')&&<section className="map-teaser paper-bg">\n      <div className="container map-teaser-grid"><div><span className="eyebrow">{mapCopy.eyebrow}</span><h2>{mapCopy.title}</h2><p>{mapCopy.description}</p><Link className="btn btn-green" to="/hola-map"><Map size={17}/> Mở HOLA Map</Link></div><div className="fake-map"><div className="map-road r1"/><div className="map-road r2"/>{places.slice(0,3).map((p,index)=><span className={'pin p'+(index+1)} key={p.id}><MapPin/></span>)}{places.slice(0,3).map((p,index)=><span className={'map-label l'+(index+1)} key={'label-'+p.id}>{p.name}</span>)}</div>{mapPreview?<div className="place-preview">{mapPreview.image?<img src={mapPreview.image} alt={mapPreview.name}/>:<div className="theme-card-placeholder"/>}<h3>{mapPreview.name}</h3><small>{mapPreview.category}</small><p>{mapPreview.description}</p></div>:<div className="place-preview"><div className="theme-card-placeholder"/><h3>HOLA Map</h3><small>Đang cập nhật địa điểm</small><p>Dữ liệu địa điểm sẽ xuất hiện khi được xuất bản từ hệ thống.</p></div>}</div>\n    </section>}'''

          new_map = '''    {sectionOn('map')&&<section className="map-teaser paper-bg home-map-live-section">\n      <div className="container map-teaser-grid home-map-live-grid">\n        <div className="home-map-live-copy">\n          <span className="eyebrow">{mapCopy.eyebrow}</span>\n          <h2>{mapCopy.title}</h2>\n          <p>{mapCopy.description}</p>\n          <div className="home-map-live-meta"><MapPin size={15}/><span>Địa điểm thật · dữ liệu trực tiếp từ Hola Maps</span></div>\n          <Link className="btn btn-green" to="/hola-map"><Map size={17}/> Mở HOLA Map</Link>\n        </div>\n\n        <div className="home-map-live-frame">\n          {holaMapEmbedUrl\n            ? <iframe\n                src={holaMapEmbedUrl}\n                title="Hola Maps - Bản đồ Hòa Lạc"\n                loading="lazy"\n                referrerPolicy="strict-origin-when-cross-origin"\n              />\n            : <div className="home-map-live-loading"><MapPin/><span>Đang tải Hola Maps…</span></div>}\n          <div className="home-map-live-badge"><span className="home-map-live-dot"/>LIVE · HOLA MAPS</div>\n        </div>\n      </div>\n    </section>}'''

          if old_map not in text:
            raise SystemExit('Homepage map teaser block not found')
          text = text.replace(old_map, new_map, 1)
          home.write_text(text)

          styles = Path('frontend/src/styles.css')
          css = styles.read_text()
          marker = '/* homepage official Hola Maps embed */'
          if marker not in css:
            css += '''\n\n/* homepage official Hola Maps embed */\n.home-map-live-section{padding:56px 0 58px;overflow:hidden}\n.home-map-live-grid{grid-template-columns:minmax(250px,.72fr) minmax(0,2.28fr);gap:34px;align-items:center}\n.home-map-live-copy{min-width:0}\n.home-map-live-copy h2{margin:4px 0 12px}\n.home-map-live-copy>p{color:#56625a;line-height:1.68;max-width:420px;margin-bottom:13px}\n.home-map-live-meta{display:flex;align-items:center;gap:7px;color:#6d766f;font-size:.72rem;margin:0 0 20px}\n.home-map-live-meta svg{color:var(--terra);flex:0 0 auto}\n.home-map-live-frame{position:relative;height:360px;min-width:0;border-radius:22px;overflow:hidden;background:#dfe7df;border:1px solid rgba(23,61,45,.13);box-shadow:0 18px 44px rgba(40,48,42,.12)}\n.home-map-live-frame iframe{display:block;width:100%;height:100%;border:0;background:#e8eee9}\n.home-map-live-loading{height:100%;display:flex;align-items:center;justify-content:center;gap:9px;color:#667169;font-size:.8rem;background:linear-gradient(145deg,#e7eee7,#dce7df)}\n.home-map-live-loading svg{color:var(--terra)}\n.home-map-live-badge{position:absolute;left:14px;bottom:14px;z-index:2;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(25,40,31,.12);font-size:.61rem;font-weight:850;letter-spacing:.09em;color:var(--forest);pointer-events:none}\n.home-map-live-dot{width:7px;height:7px;border-radius:50%;background:#2c9b61;box-shadow:0 0 0 4px rgba(44,155,97,.13)}\n@media(max-width:900px){.home-map-live-grid{grid-template-columns:1fr;gap:22px}.home-map-live-copy>p{max-width:620px}.home-map-live-frame{height:380px}}\n@media(max-width:600px){.home-map-live-section{padding:38px 0 42px}.home-map-live-frame{height:310px;border-radius:16px}.home-map-live-grid{gap:18px}.home-map-live-meta{margin-bottom:15px}.home-map-live-badge{left:10px;bottom:10px;font-size:.56rem;padding:6px 9px}}\n'''
          styles.write_text(css)
          PY

      - name: Commit homepage map integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/HomePage.jsx frontend/src/styles.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'connect homepage preview to official Hola Maps embed'
          git push origin HEAD:main
